name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q agent_harness scripts adapters evals tests
      - name: Unit and integration tests
        run: python -m unittest discover -v
      - name: Verify generated adapters
        run: python scripts/sync_adapters.py --check
      - name: Run offline protocol evals
        run: python evals/runner/run.py
