name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Smoke test installed CLI
        run: graphctl --graph examples/quickstart/task-graph.json validate
      - name: Compile
        run: python -m compileall -q agent_harness scripts adapters evals tests
      - name: Unit and integration tests
        run: python -m unittest discover -v
      - name: Verify generated adapters
        run: python scripts/sync_adapters.py --check
      - name: Run offline protocol evals
        run: python evals/runner/run.py

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install package with static-check tools
        run: python -m pip install ".[dev]"
      - name: Check formatting
        run: python -m black --check agent_harness scripts tests adapters evals
      - name: Check types
        run: python -m mypy agent_harness scripts adapters evals tests
